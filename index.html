<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet Northbound Coffee, a small-batch coffee roaster.">
  <title>Northbound Coffee | Small-Batch Roasters</title>

  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=PT+Sans:400,400i,700,700i">
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="home">
  <header class="site-header">
        <div class="container header-row">
            <a class="brand" href="#home">Northbound Coffee<span>.</span></a>

            <nav aria-label="Main navigation">
            <details class="mobile-menu">
                <summary aria-label="Navigation menu">
                <span class="hamburger" aria-hidden="true">☰</span>
                </summary>
                <div class="mobile-links">
                <a href="#home">Home</a>
                <a href="#shop">Shop</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
                </div>
            </details>

            <div class="desktop-links">
                <a href="#home">Home</a>
                <a href="#shop">Shop</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>
            </nav>
        </div>
    </header>

  <main>
    <section class="hero" id="shop" aria-labelledby="hero-title">
        <div class="container hero-grid">
            <div class="hero-copy">
            <h1 id="hero-title">Good mornings start up north.</h1>
            <p>Meet Trailhead, our small-batch roast with notes of cocoa and toasted almond.</p>
            <a class="button" href="mailto:hello@northbound.example?subject=Trailhead%20coffee">
                Enquire about Trailhead
            </a>
            </div>

            <div class="roast-art" aria-hidden="true">
            <div class="coffee-bag">
                <span class="bag-brand">Northbound</span>
                <strong>Trailhead</strong>
                <span class="bag-detail">Medium roast · 340 g</span>
            </div>
            </div>
        </div>
    </section>
  </main>

  <!-- Footer goes here -->
</body>
</html>
